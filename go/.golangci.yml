version: "2"

run:
  timeout: 2m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - "all"
        # QF are refactoring suggestions and ST is naming style; gofmt and
        # review cover both, and neither should fail a build.
        - "-QF*"
        - "-ST*"
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
