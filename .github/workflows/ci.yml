name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[discovery]" pytest

      - name: Test
        run: python -m pytest effigy/tests/ -v --tb=short

      - name: Compile fixture
        run: python -m effigy compile effigy/tests/fixtures/test_npc.effigy

      - name: Import check
        run: python -c "from effigy import parse, CharacterAST, NarrativeRole; print('OK')"

  go:
    # go/notation reads the notation the Python package defines, and its tests
    # compare the two declarations directly. Running it here is the point: a
    # block added to notation.py without the Go vocabulary fails on the commit
    # that adds it rather than in a consumer later.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          # No dependencies, so no go.sum for the cache to key on.
          cache: false

      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
        working-directory: go

      - name: Test
        run: go test ./... -v
        working-directory: go

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: go
